# system_bringup 运行配置 —— bringup.launch.py 运行时用 find_repo_root() 读**源码**本文件
# (不经 install),故改这里不用 rebuild system_bringup。
# 勿加进 setup.py data_files(不 install)——否则改了要 rebuild,失去本设计的意义。

# === 顶层:改这两行切 4 组合(sim/real × navigation/mapping),不用 rebuild ===
platform: sim              # sim | real
mode: navigation           # navigation | mapping

# === 仿真底层:robot_gz_bringup(platform=sim 时生效)===
robot_gz:
  gui: "true"
  rviz: "false"               # robot_gz 的 RViz(lio_sam 自带 RViz 不受此控)
  world: factory.sdf
  spawn_x: "4.0"
  spawn_y: "0.0"
  spawn_z: "0.05"

# === 真机底层:robot_bringup(platform=real 时生效,本期骨架 TODO)===
robot_bringup:
  use_mock_hardware: false

# === slam_stack:mode=navigation 起 fast_lio→gicp→nav2;mode=mapping 起 lio_sam ===
slam_stack:
  settling: 20.0              # ready_gate 就绪后再等的稳定秒数(所有 gate 共用)
  fast_lio:
    config: gazebo_velodyne.yaml
  gicp_localization:
    prior_map_path: ~/result/GlobalMap.pcd     # 先验图(save_map.sh 落 ~/result)
  robot_navigation:
    map: ~/result/factory_map.yaml             # 占据栅格(pcd_to_occupancy 生成)
