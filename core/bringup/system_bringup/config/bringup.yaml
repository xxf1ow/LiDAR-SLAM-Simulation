# system_bringup 运行配置 —— bringup.launch.py 从 colcon install 布局固定映射到**源码**本文件，
# 再由 compile_runtime_configs() 编译到独立 /tmp 运行时目录；改本文件不用 rebuild。
# 本文件仍不进入 setup.py data_files，避免 install 副本成为第二配置源。

# === 顶层:改这两行切 4 组合(sim/real × navigation/mapping),不用 rebuild ===
platform: sim              # sim | real
mode: navigation           # navigation | mapping

# === 平台事实 Profile：路径相对本文件解析 ===
profiles:
  sim: profiles/sim.yaml    # 仿真平台完整事实
  real: profiles/real.yaml  # 当前实机完整事实

# === 地图与算法工作目录：原样传给对应原生组件，不在编译期展开或创建 ===
map_artifacts:
  lio_sam_work_dir: /result/loam/ # LIO-SAM 使用 $HOME + 此路径，并会重建该专用子目录
  prior_pcd: ~/result/GlobalMap.pcd # GICP 先验点云，由 6B launch 覆盖原生空占位
  nav2_map: ~/result/factory_map.yaml # Nav2 栅格地图，由 6B launch 覆盖原生空占位

# === 仿真底层:robot_gz_bringup(platform=sim 时生效)===
robot_gz:
  gui: "true"
  rviz: "false"               # robot_gz 的 RViz(lio_sam 自带 RViz 不受此控)
  world: factory.sdf
  spawn_x: "4.0"
  spawn_y: "0.0"
  spawn_z: "0.05"

# === 共享上层编排 ===
slam_stack:
  settling: 20.0              # ready_gate 就绪后再等的稳定秒数(所有 gate 共用)
