<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>机器人控制</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --canvas: #0b1220;
      --surface: #162033;
      --line: #2d3b52;
      --text: #f2f6fb;
      --muted: #9aabc0;
      --motion: #4db7d6;
      --manual: #d49a32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--canvas);
      color: var(--text);
    }
    main {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #mapCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      left: 12px;
      right: 12px;
      pointer-events: auto;
    }
    #statusStrip {
      top: max(12px, env(safe-area-inset-top));
      right: auto;
      width: max-content;
      max-width: calc(100vw - 24px);
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(11, 18, 32, 0.68);
      pointer-events: none;
      color: #f2f6fb;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
    }
    #statusStrip p { margin: 0 0 4px; }
    #feedbackState::before { content: "· "; }
    #navigationStatus { color: #c2410c; }
    .notice { color: #b91c1c; }
    #controlDock {
      bottom: max(12px, env(safe-area-inset-bottom));
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }
    .map-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .context-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    #operationRegion {
      display: grid;
      gap: 8px;
      min-height: 0;
    }
    #parkingActions { border-top: 1px solid var(--line); padding-top: 8px; }
    #saveParkingForm {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
    }
    #parkingName { min-height: 44px; min-width: 0; }
    #parkingDrawer {
      display: grid;
      gap: 8px;
      max-height: 55dvh;
      min-height: 0;
      overflow: hidden;
    }
    #parkingDrawerHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
    }
    #parkingList {
      display: grid;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .parking-row {
      display: grid;
      grid-template-columns: 2.5rem minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      min-height: 44px;
      padding: 4px 0;
    }
    .parking-row button { min-height: 40px; padding: 4px 10px; }
    .parking-row-confirm { grid-template-columns: minmax(0, 1fr) auto auto; }
    #manualControls { display: grid; gap: 8px; }
    .speed-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) 3.5rem;
      align-items: center;
      gap: 12px;
    }
    input[type="range"] {
      min-width: 0;
      min-height: 44px;
      accent-color: var(--motion);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      background: #243147;
      font: inherit;
      font-weight: 750;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: background-color 100ms ease, transform 100ms ease;
    }
    button:active {
      background: #267d99;
      transform: scale(.97);
    }
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--manual);
      outline-offset: 3px;
    }
    .controls button, .map-actions button, .context-grid button { min-height: 44px; }
    #modeToggle {
      width: 100%;
      min-height: 52px;
      border-color: #8e6726;
      background: #59431f;
    }
    [hidden] { display: none !important; }
    @media (max-height: 620px) {
      .controls {
        gap: 8px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:active { transform: none; }
    }
  </style>
</head>
<body>
<canvas id="mapCanvas" aria-label="导航地图"></canvas>
<main>
  <section id="statusStrip" class="overlay" aria-label="机器人状态">
    <p id="modeStatus">控制模式：状态同步中</p>
    <p id="motionStatus">
      线速度 <strong id="linearVelocity">--</strong>
      · 角速度 <strong id="angularVelocity">--</strong>
      <span id="feedbackState">底盘反馈中断</span>
    </p>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <p id="navigationStatus" role="status" aria-live="polite"></p>
  </section>
  <section id="controlDock" class="overlay" aria-label="操作区">
    <section id="operationRegion">
      <section id="mapActions" class="map-actions" aria-label="地图视图">
        <button id="mapZoomOut" aria-label="缩小地图">−</button>
        <button id="mapZoomIn" aria-label="放大地图">+</button>
        <button id="mapFit" aria-label="适配地图">适配</button>
        <button id="mapCenterRobot" aria-label="居中机器人">居中</button>
      </section>
      <section id="navigationActions" class="context-grid" aria-label="导航操作" hidden>
        <button id="setInitialPose" disabled>设置初始位姿</button>
        <button id="navigationAction" disabled>设置导航目标</button>
        <button id="confirmPlacement" hidden disabled>确认位置</button>
        <button id="cancelPlacement" hidden disabled>取消放置</button>
      </section>
      <section id="parkingActions" class="context-grid" aria-label="停车点操作" hidden>
        <button id="saveParkingPoint" type="button">保存停车点</button>
        <button id="goToParkingPoint" type="button">前往停车点</button>
      </section>
      <form id="saveParkingForm" aria-label="保存停车点" hidden>
        <input id="parkingName" type="text" autocomplete="off" aria-label="停车点名称">
        <button id="confirmSaveParkingPoint" type="button">保存</button>
        <button id="cancelSaveParkingPoint" type="button">取消</button>
      </form>
      <section id="parkingDrawer" aria-label="停车点列表" hidden>
        <header id="parkingDrawerHeader">
          <strong>停车点</strong>
          <button id="parkingDrawerClose" type="button">关闭</button>
        </header>
        <section id="parkingList" aria-label="已保存停车点"></section>
      </section>
      <section id="manualControls" aria-label="手动控制" hidden>
        <section class="speed-row" aria-label="速度设置">
          <label for="speed">速度</label>
          <input id="speed" type="range" min="0" max="100" value="20" step="1">
          <output id="speedValue" for="speed">20%</output>
        </section>
        <section class="controls" aria-label="移动方向">
        <button disabled data-direction="forward" aria-label="前进">前进</button>
        <button disabled data-direction="backward" aria-label="后退">后退</button>
        <button disabled data-direction="left" aria-label="左转">左转</button>
        <button disabled data-direction="right" aria-label="右转">右转</button>
        </section>
      </section>
    </section>
    <button id="modeToggle" disabled>状态同步中…</button>
  </section>
</main>

<script src="/map_view.js"></script>
<script>
  const speed = document.getElementById("speed");
  const speedValue = document.getElementById("speedValue");
  const modeStatus = document.getElementById("modeStatus");
  const notice = document.getElementById("notice");
  const modeToggle = document.getElementById("modeToggle");
  const linearVelocity = document.getElementById("linearVelocity");
  const angularVelocity = document.getElementById("angularVelocity");
  const feedbackState = document.getElementById("feedbackState");
  const mapActions = document.getElementById("mapActions");
  const navigationActions = document.getElementById("navigationActions");
  const parkingActions = document.getElementById("parkingActions");
  const saveParkingPoint = document.getElementById("saveParkingPoint");
  const goToParkingPoint = document.getElementById("goToParkingPoint");
  const saveParkingForm = document.getElementById("saveParkingForm");
  const parkingName = document.getElementById("parkingName");
  const confirmSaveParkingPoint = document.getElementById("confirmSaveParkingPoint");
  const cancelSaveParkingPoint = document.getElementById("cancelSaveParkingPoint");
  const parkingDrawer = document.getElementById("parkingDrawer");
  const parkingDrawerClose = document.getElementById("parkingDrawerClose");
  const parkingList = document.getElementById("parkingList");
  const manualControls = document.getElementById("manualControls");
  let mapView = null;
  let desiredDirection = "stop";
  let commandLoopRunning = false;
  let manualSessionId = null;
  let nextSequence = 1;
  let highestHandledSequence = 0;
  let modeGeneration = 0;
  let commandTimer = null;
  const activeControllers = new Set();
  const COMMAND_PERIOD_MS = 100;
  const COMMAND_TIMEOUT_MS = 400;
  let noticeOwner = null;
  const heldMovementKeys = [];
  const motionButtons = document.querySelectorAll("[data-direction]");
  let currentMode = null;
  let modeSwitchPending = false;
  let modeSwitchTarget = null;
  let buttonMotionOwner = null;
  let parkingPoints = [];
  let parkingRefreshGeneration = 0;
  let parkingDrawerOpen = false;
  let saveParkingFormOpen = false;

  speed.addEventListener("input", () => {
    speedValue.textContent = speed.value + "%";
    signalCommandChange();
  });

  function signalCommandChange() {
    dispatchManualCommand();
  }

  function setDesiredDirection(direction, force = false) {
    if (!force && desiredDirection === direction) return;
    desiredDirection = direction;
    signalCommandChange();
  }

  function applyMotionFeedback(payload) {
    if (
      payload.feedback_fresh === true
      && Number.isFinite(payload.linear_x)
      && Number.isFinite(payload.angular_z)
    ) {
      linearVelocity.textContent = `${payload.linear_x.toFixed(2)} m/s`;
      angularVelocity.textContent = `${payload.angular_z.toFixed(2)} rad/s`;
      feedbackState.textContent = "";
      feedbackState.hidden = true;
      return;
    }
    linearVelocity.textContent = "--";
    angularVelocity.textContent = "--";
    feedbackState.textContent = "底盘反馈中断";
    feedbackState.hidden = false;
  }

  async function post(path, body, options = {}) {
    const requestOptions = {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    };
    if (options.signal !== undefined) requestOptions.signal = options.signal;
    const response = await fetch(path, requestOptions);
    const payload = await response.json();
    if (options.applyFeedback !== false) applyResponseFeedback(payload);
    if (!response.ok) {
      const error = new Error(
        payload.error || `HTTP ${response.status}`
      );
      error.payload = payload;
      throw error;
    }
    return payload;
  }

  function applyResponseFeedback(payload) {
    if (
      Object.prototype.hasOwnProperty.call(payload, "linear_x")
      && Object.prototype.hasOwnProperty.call(payload, "angular_z")
      && Object.prototype.hasOwnProperty.call(payload, "feedback_fresh")
    ) {
      applyMotionFeedback(payload);
    }
  }

  async function get(path) {
    const response = await fetch(path);
    const payload = await response.json();
    if (!response.ok) {
      const error = new Error(payload.error || `HTTP ${response.status}`);
      error.payload = payload;
      throw error;
    }
    return payload;
  }

  function clearParkingNotice() {
    if (noticeOwner !== "parking") return;
    noticeOwner = null;
    notice.textContent = "";
  }

  function showParkingRequestFailure(error) {
    noticeOwner = "parking";
    notice.textContent = `请求失败：${error.message}`;
  }

  function nextParkingName(points = parkingPoints) {
    let highest = 0;
    points.forEach((point) => {
      if (!point || typeof point.name !== "string") return;
      const match = point.name.match(/^停车点 ([1-9][0-9]*)$/);
      if (match) highest = Math.max(highest, Number(match[1]));
    });
    return `停车点 ${highest + 1}`;
  }

  function updateParkingPoints(points) {
    parkingPoints = Array.isArray(points) ? points.slice() : [];
    if (mapView) mapView.setParkingPoints(parkingPoints);
    if (parkingDrawerOpen) renderParkingDrawer();
  }

  async function refreshParkingPoints() {
    const generation = ++parkingRefreshGeneration;
    try {
      const payload = await get("/api/parking-points");
      if (generation !== parkingRefreshGeneration) return parkingPoints;
      clearParkingNotice();
      updateParkingPoints(payload.points);
      return parkingPoints;
    } catch (error) {
      if (generation !== parkingRefreshGeneration) return parkingPoints;
      showParkingRequestFailure(error);
      return null;
    }
  }

  function closeSaveParkingForm() {
    saveParkingFormOpen = false;
    saveParkingForm.hidden = true;
    confirmSaveParkingPoint.disabled = false;
    cancelSaveParkingPoint.disabled = false;
  }

  function openSaveParkingForm() {
    if (currentMode !== "automatic" || parkingDrawerOpen) return;
    parkingName.value = nextParkingName();
    saveParkingFormOpen = true;
    saveParkingForm.hidden = false;
  }

  async function saveParkingPointRequest() {
    if (!saveParkingFormOpen) return;
    confirmSaveParkingPoint.disabled = true;
    cancelSaveParkingPoint.disabled = true;
    try {
      await post("/api/parking-points/save", {name: parkingName.value}, {
        applyFeedback: false
      });
      closeSaveParkingForm();
      clearParkingNotice();
      await refreshParkingPoints();
    } catch (error) {
      confirmSaveParkingPoint.disabled = false;
      cancelSaveParkingPoint.disabled = false;
      showParkingRequestFailure(error);
    }
  }

  function parkingButton(label, name, action) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.dataset.name = name;
    button.dataset.action = action;
    return button;
  }

  function renderParkingRow(row) {
    const point = parkingPoints.find((candidate) =>
      candidate.name === row.dataset.name
    );
    if (!point) return;
    row.dataset.name = point.name;
    row.dataset.action = "row";
    row.classList.add("parking-row");
    const number = document.createElement("span");
    number.textContent = String(point.number);
    const name = document.createElement("span");
    name.textContent = point.name;
    row.replaceChildren(
      number,
      name,
      parkingButton("前往", point.name, "navigate"),
      parkingButton("删除", point.name, "delete")
    );
  }

  function showDeleteConfirmation(row) {
    row.classList.add("parking-row-confirm");
    const prompt = document.createElement("span");
    prompt.textContent = "删除这个停车点？";
    row.replaceChildren(
      prompt,
      parkingButton("确认删除", row.dataset.name, "delete-confirm"),
      parkingButton("取消", row.dataset.name, "delete-cancel")
    );
  }

  function renderParkingDrawer() {
    parkingList.replaceChildren();
    parkingPoints.forEach((point) => {
      const row = document.createElement("article");
      row.dataset.name = point.name;
      parkingList.append(row);
      renderParkingRow(row);
    });
  }

  function parkingRowForTarget(target) {
    let candidate = target;
    while (candidate && candidate !== parkingList) {
      if (candidate.dataset && candidate.dataset.action === "row") {
        return candidate;
      }
      candidate = candidate.parentNode;
    }
    return null;
  }

  async function handleParkingListClick(event) {
    const target = event.target;
    const action = target && target.dataset ? target.dataset.action : null;
    const row = parkingRowForTarget(target);
    const name = target && target.dataset && target.dataset.name
      ? target.dataset.name
      : row && row.dataset.name;
    if (!action || !name || !row) return;
    if (action === "navigate") {
      closeParkingDrawer();
      try {
        await post("/api/parking-points/navigate", {name}, {
          applyFeedback: false
        });
      } catch (error) {
        if (mapView) mapView.showNavigationRequestFailure(error);
      }
      return;
    }
    if (action === "delete") {
      showDeleteConfirmation(row);
      return;
    }
    if (action === "delete-cancel") {
      row.classList.remove("parking-row-confirm");
      renderParkingRow(row);
      return;
    }
    if (action !== "delete-confirm") return;
    target.disabled = true;
    try {
      await post("/api/parking-points/delete", {name}, {
        applyFeedback: false
      });
      clearParkingNotice();
      await refreshParkingPoints();
    } catch (error) {
      target.disabled = false;
      showParkingRequestFailure(error);
    }
  }

  function openParkingDrawer() {
    if (currentMode !== "automatic" || modeSwitchInProgress()) return;
    parkingDrawerOpen = true;
    closeSaveParkingForm();
    renderParkingDrawer();
    if (mapView) {
      mapView.setParkingPoints(parkingPoints);
      mapView.setParkingPointsVisible(true);
    }
    renderControls();
  }

  function closeParkingDrawer() {
    parkingDrawerOpen = false;
    if (mapView) mapView.setParkingPointsVisible(false);
    renderControls();
  }

  function modeSwitchInProgress() {
    return modeSwitchPending || modeSwitchTarget !== null;
  }

  function renderControls() {
    const modePending = modeSwitchInProgress();
    const previousContext = navigationActions.hidden + ":"
      + parkingActions.hidden + ":" + manualControls.hidden + ":"
      + parkingDrawer.hidden;
    if (modePending) {
      modeToggle.textContent = "切换中…";
      modeToggle.disabled = true;
    } else if (currentMode === "automatic") {
      modeToggle.textContent = "人工接管";
      modeToggle.disabled = false;
    } else if (currentMode === "manual") {
      modeToggle.textContent = "恢复自动导航";
      modeToggle.disabled = false;
    } else {
      modeToggle.textContent = "状态同步中…";
      modeToggle.disabled = true;
    }
    motionButtons.forEach((button) => {
      button.disabled = currentMode !== "manual" || modePending;
    });
    modeStatus.textContent = modePending
      ? "控制模式：切换中"
      : currentMode === "automatic"
        ? "控制模式：自动导航"
        : currentMode === "manual"
          ? "控制模式：人工接管"
          : "控制模式：状态同步中";
    const drawerVisible = parkingDrawerOpen && currentMode === "automatic";
    mapActions.hidden = drawerVisible;
    navigationActions.hidden = currentMode !== "automatic"
      || modePending || drawerVisible;
    parkingActions.hidden = currentMode !== "automatic"
      || modePending || drawerVisible;
    parkingDrawer.hidden = !drawerVisible;
    saveParkingForm.hidden = !saveParkingFormOpen || drawerVisible
      || currentMode !== "automatic" || modePending;
    manualControls.hidden = currentMode !== "manual" || modePending;
    const nextContext = navigationActions.hidden + ":"
      + parkingActions.hidden + ":" + manualControls.hidden + ":"
      + parkingDrawer.hidden;
    if (mapView && previousContext !== nextContext) mapView.refreshViewport();
  }

  function applyMode(mode, skipStop = false) {
    const previousMode = currentMode;
    currentMode = mode === "manual" || mode === "automatic"
      ? mode
      : null;
    if (currentMode === modeSwitchTarget) {
      modeSwitchPending = false;
      modeSwitchTarget = null;
    }
    if (currentMode !== "manual" && !skipStop) stopMotion();
    if (currentMode !== "automatic") {
      closeSaveParkingForm();
      if (parkingDrawerOpen) {
        parkingDrawerOpen = false;
        if (mapView) mapView.setParkingPointsVisible(false);
      }
    }
    renderControls();
    if (currentMode === "automatic" && previousMode !== "automatic") {
      refreshParkingPoints();
    }
  }

  function applyResponseMode(payload, options = {}) {
    if (Object.prototype.hasOwnProperty.call(payload, "mode")) {
      applyMode(payload.mode, options.skipStop === true);
    }
  }

  function showRequestFailure(error, owner = "motion") {
    if (modeSwitchPending && owner === "motion") return;
    noticeOwner = owner;
    notice.textContent = `请求失败：${error.message}`;
  }

  function handleManualResponse(payload, snapshot) {
    if (
      payload.reason === "inactive_session"
      && snapshot.sessionId === manualSessionId
      && snapshot.generation === modeGeneration
    ) {
      terminateManualSession();
      return false;
    }
    if (
      snapshot.sessionId !== manualSessionId
      || snapshot.generation !== modeGeneration
      || snapshot.sequence < highestHandledSequence
    ) return false;
    highestHandledSequence = snapshot.sequence;
    if (payload.reason === "stale_sequence") return false;
    if (!modeSwitchInProgress()) {
      applyResponseMode(payload);
      applyResponseFeedback(payload);
      if (noticeOwner === "motion") {
        noticeOwner = null;
        notice.textContent = "";
      }
    }
    return true;
  }

  function handleManualError(error, snapshot) {
    if (error.name === "AbortError") return;
    if (
      snapshot.sessionId !== manualSessionId
      || snapshot.generation !== modeGeneration
      || snapshot.sequence < highestHandledSequence
    ) return;
    if (error.payload) {
      handleManualResponse(error.payload, snapshot);
      if (
        snapshot.sessionId !== manualSessionId
        || snapshot.generation !== modeGeneration
        || snapshot.sequence < highestHandledSequence
      ) return;
      if (error.payload.reason === "stale_sequence") return;
    }
    highestHandledSequence = snapshot.sequence;
    showRequestFailure(error);
  }

  function dispatchManualCommand() {
    if (!commandLoopRunning || manualSessionId === null) return;
    const snapshot = {
      sessionId: manualSessionId,
      sequence: nextSequence++,
      generation: modeGeneration
    };
    const controller = new AbortController();
    activeControllers.add(controller);
    const timeoutId = setTimeout(() => controller.abort(), COMMAND_TIMEOUT_MS);
    controller.timeoutId = timeoutId;
    post("/api/manual-command", {
      session_id: snapshot.sessionId,
      sequence: snapshot.sequence,
      direction: desiredDirection,
      speed_percent: Number(speed.value)
    }, {
      signal: controller.signal,
      applyFeedback: false
    }).then(
      (payload) => handleManualResponse(payload, snapshot)
    ).catch(
      (error) => handleManualError(error, snapshot)
    ).finally(() => {
      clearTimeout(timeoutId);
      activeControllers.delete(controller);
    });
  }

  function commandLoop() {
    if (commandLoopRunning || manualSessionId === null) return;
    commandLoopRunning = true;
    dispatchManualCommand();
    const tick = () => {
      if (!commandLoopRunning) return;
      dispatchManualCommand();
      commandTimer = setTimeout(tick, COMMAND_PERIOD_MS);
    };
    commandTimer = setTimeout(tick, COMMAND_PERIOD_MS);
  }

  function beginMotion(event) {
    if (currentMode !== "manual" || modeSwitchInProgress()) return;
    buttonMotionOwner = event.currentTarget;
    setDesiredDirection(event.currentTarget.dataset.direction);
    event.currentTarget.setPointerCapture(event.pointerId);
  }

  function stopMotion() {
    buttonMotionOwner = null;
    heldMovementKeys.length = 0;
    setDesiredDirection("stop", true);
  }

  function stopOwnedButtonMotion(event) {
    if (buttonMotionOwner !== event.currentTarget) return;
    stopMotion();
  }

  function beginKeyboardMotion(event) {
    if (currentMode !== "manual" || modeSwitchInProgress()) return;
    if ((event.key !== " " && event.key !== "Enter") || event.repeat) return;
    event.preventDefault();
    buttonMotionOwner = event.currentTarget;
    setDesiredDirection(event.currentTarget.dataset.direction);
  }

  motionButtons.forEach((button) => {
    button.addEventListener("pointerdown", beginMotion);
    button.addEventListener("pointerup", stopOwnedButtonMotion);
    button.addEventListener("pointercancel", stopOwnedButtonMotion);
    button.addEventListener("lostpointercapture", stopOwnedButtonMotion);
    button.addEventListener("keydown", beginKeyboardMotion);
    button.addEventListener("keyup", stopOwnedButtonMotion);
    button.addEventListener("blur", stopOwnedButtonMotion);
  });

  const keyboardDirections = {
    w: "forward",
    a: "left",
    s: "backward",
    d: "right"
  };

  function beginWasdMotion(event) {
    if (currentMode !== "manual" || modeSwitchInProgress()) return;
    const key = event.key.toLowerCase();
    const direction = keyboardDirections[key];
    if (direction === undefined || event.repeat) return;
    event.preventDefault();
    const previousIndex = heldMovementKeys.indexOf(key);
    if (previousIndex !== -1) heldMovementKeys.splice(previousIndex, 1);
    heldMovementKeys.push(key);
    setDesiredDirection(direction);
  }

  function endWasdMotion(event) {
    const key = event.key.toLowerCase();
    if (keyboardDirections[key] === undefined) return;
    event.preventDefault();
    const keyIndex = heldMovementKeys.indexOf(key);
    if (keyIndex !== -1) heldMovementKeys.splice(keyIndex, 1);
    const activeKey = heldMovementKeys[heldMovementKeys.length - 1];
    setDesiredDirection(activeKey === undefined
      ? "stop"
      : keyboardDirections[activeKey]);
  }

  document.addEventListener("keydown", beginWasdMotion);
  document.addEventListener("keyup", endWasdMotion);

  function terminateManualSession() {
    commandLoopRunning = false;
    if (commandTimer !== null) clearTimeout(commandTimer);
    commandTimer = null;
    activeControllers.forEach((controller) => {
      if (controller.timeoutId !== undefined) clearTimeout(controller.timeoutId);
      controller.abort();
    });
    activeControllers.clear();
    manualSessionId = null;
    nextSequence = 1;
    highestHandledSequence = 0;
    modeGeneration += 1;
    modeSwitchPending = false;
    modeSwitchTarget = null;
    stopMotion();
    applyMode(null);
  }

  async function requestMode() {
    if (
      modeSwitchPending
      || (currentMode !== "manual" && currentMode !== "automatic")
    ) return;
    const observedMode = currentMode;
    const requestGeneration = ++modeGeneration;
    let settledGeneration = null;
    modeSwitchTarget = currentMode === "automatic"
      ? "manual"
      : "automatic";
    const path = currentMode === "automatic"
      ? "/api/takeover-manual"
      : "/api/resume-automatic";
    const successMessage = observedMode === "automatic"
      ? "人工接管请求已完成"
      : "恢复自动导航请求已完成";
    if (observedMode === "automatic" && mapView) {
      mapView.cancelPlacement();
    }
    modeSwitchPending = true;
    stopMotion();
    renderControls();
    try {
      const payload = await post(path, {}, {applyFeedback: false});
      if (requestGeneration !== modeGeneration) return;
      modeGeneration += 1;
      settledGeneration = modeGeneration;
      applyResponseFeedback(payload);
      applyResponseMode(payload, {skipStop: true});
      noticeOwner = "mode";
      notice.textContent = payload.pending
        ? "切换结果尚未确认"
        : successMessage;
    } catch (error) {
      if (requestGeneration !== modeGeneration) return;
      modeGeneration += 1;
      settledGeneration = modeGeneration;
      if (error.payload) applyResponseFeedback(error.payload);
      if (error.payload) applyResponseMode(error.payload);
      modeSwitchPending = false;
      modeSwitchTarget = null;
      showRequestFailure(error, "mode");
    } finally {
      if (settledGeneration !== null) renderControls();
    }
  }

  saveParkingPoint.addEventListener("click", openSaveParkingForm);
  confirmSaveParkingPoint.addEventListener("click", saveParkingPointRequest);
  cancelSaveParkingPoint.addEventListener("click", closeSaveParkingForm);
  goToParkingPoint.addEventListener("click", openParkingDrawer);
  parkingDrawerClose.addEventListener("click", closeParkingDrawer);
  parkingList.addEventListener("click", handleParkingListClick);
  modeToggle.addEventListener("click", requestMode);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopMotion();
  });
  window.addEventListener("pagehide", stopMotion);
  window.addEventListener("blur", stopMotion);
  applyMode(null);
  async function startManualSession() {
    try {
      const payload = await post("/api/manual-session", {});
      if (typeof payload.session_id !== "string" || !payload.session_id) {
        throw new Error("manual session was not initialized");
      }
      manualSessionId = payload.session_id;
      nextSequence = 1;
      highestHandledSequence = 0;
      applyMode(payload.mode);
      commandLoop();
    } catch (error) {
      applyMode(null);
      showRequestFailure(error, "session");
    }
  }
  startManualSession();
  if (globalThis.RobotMapView) {
    mapView = RobotMapView.create({
      canvas: document.getElementById("mapCanvas"),
      buttons: {
        zoomIn: document.getElementById("mapZoomIn"),
        zoomOut: document.getElementById("mapZoomOut"),
        fit: document.getElementById("mapFit"),
        centerRobot: document.getElementById("mapCenterRobot")
      },
      navigationButtons: {
        initialPose: document.getElementById("setInitialPose"),
        navigationAction: document.getElementById("navigationAction"),
        placementConfirm: document.getElementById("confirmPlacement"),
        placementCancel: document.getElementById("cancelPlacement"),
        parkingActions: [saveParkingPoint, goToParkingPoint]
      },
      statusStrip: document.getElementById("statusStrip"),
      controlDock: document.getElementById("controlDock"),
      navigationStatus: document.getElementById("navigationStatus"),
      request: post
    });
    mapView.setParkingPoints(parkingPoints);
  }
</script>
</body>
</html>
