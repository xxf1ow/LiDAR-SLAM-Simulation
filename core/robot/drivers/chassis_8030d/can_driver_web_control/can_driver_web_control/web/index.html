<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>8030D 底盘测试</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #111827; color: #f9fafb;
      display: grid; place-items: center; overscroll-behavior: none;
    }
    main { width: min(100%, 430px); padding: 16px; }
    h1 { margin: 0 0 12px; font-size: 1.35rem; }
    .panel {
      background: #1f2937; border: 1px solid #374151; border-radius: 14px;
      padding: 14px; margin-bottom: 12px;
    }
    .status { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .label { color: #9ca3af; font-size: .8rem; }
    .value { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .speed-row { display: flex; align-items: center; gap: 12px; }
    input[type=range] {
      flex: 1; min-width: 0; min-height: 44px; accent-color: #38bdf8;
    }
    .controls {
      display: grid; grid-template-columns: repeat(3, 84px);
      grid-template-rows: repeat(3, 74px); justify-content: center; gap: 10px;
    }
    button {
      border: 0; border-radius: 14px; color: white; background: #374151;
      font-size: 1rem; font-weight: 700; touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    button:active, button.active { background: #0284c7; transform: scale(.97); }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #fbbf24; outline-offset: 3px;
    }
    [data-direction=forward] { grid-column: 2; grid-row: 1; }
    [data-direction=left] { grid-column: 1; grid-row: 2; }
    [data-direction=right] { grid-column: 3; grid-row: 2; }
    [data-direction=backward] { grid-column: 2; grid-row: 3; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .enable { background: #15803d; min-height: 52px; }
    .disable { background: #b91c1c; min-height: 52px; }
    .ok { color: #4ade80; }
    .bad { color: #f87171; }
    .pending { color: #fbbf24; }
    .feedback-note {
      grid-column: 1 / -1; color: #fbbf24; font-size: .8rem; line-height: 1.4;
    }
    .notice { min-height: 1.3em; color: #fbbf24; font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) {
      button:active, button.active { transform: none; }
    }
  </style>
</head>
<body>
<main>
  <h1>ZL-8030D 底盘测试</h1>
  <section class="panel status">
    <div><div class="label">ROS 驱动节点</div><div id="connection" class="value bad">未发现</div></div>
    <div><div class="label">底盘速度反馈</div><div id="hardwareFeedback" class="value bad">未收到</div></div>
    <div><div class="label">使能请求</div><div id="driver" class="value pending">失能</div></div>
    <div><div class="label">当前指令</div><div id="command" class="value">[0, 0]</div></div>
    <div><div class="label">原始反馈</div><div id="feedback" class="value">暂无反馈</div></div>
    <div class="feedback-note">SDK 不提供使能成功/失败反馈；这里显示的是命令请求，不是电机确认状态。</div>
  </section>
  <section class="panel">
    <div class="speed-row">
      <label for="speed">速度</label>
      <input id="speed" type="range" min="0" max="100" value="20" step="1">
      <strong><span id="speedValue">20</span> RPM</strong>
    </div>
  </section>
  <section class="panel controls">
    <button data-direction="forward">前进</button>
    <button data-direction="left">左转</button>
    <button data-direction="right">右转</button>
    <button data-direction="backward">后退</button>
  </section>
  <section class="actions">
    <button id="enable" class="enable">电机使能</button>
    <button id="disable" class="disable">停车 / 失能</button>
  </section>
  <p id="notice" class="notice"></p>
</main>
<script>
  const speed = document.getElementById("speed");
  const speedValue = document.getElementById("speedValue");
  const notice = document.getElementById("notice");
  let activeButton = null;
  let activeDirection = "stop";
  let activePointerId = null;
  let activeKeyboardButton = null;
  let motionGeneration = 0;
  let motionRequest = null;
  let stopBarrier = null;
  let driverGeneration = 0;
  let driverRequest = null;
  let driverBarrier = null;
  let commandTimer = null;

  speed.addEventListener("input", () => { speedValue.textContent = speed.value; });

  async function post(path, body, keepalive = false) {
    const response = await fetch(path, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
      keepalive
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
    return payload;
  }

  function refreshCommand() {
    if (
      activeDirection === "stop" ||
      motionRequest !== null ||
      stopBarrier !== null
    ) return;
    const generation = motionGeneration;
    const request = post("/api/command", {
      direction: activeDirection,
      speed_rpm: Number(speed.value)
    });
    motionRequest = request;
    request
      .then(() => {
        if (generation === motionGeneration) notice.textContent = "";
      })
      .catch((error) => {
        if (generation !== motionGeneration) return;
        notice.textContent = error.message;
        stopMotion();
      })
      .finally(() => {
        if (motionRequest === request) motionRequest = null;
      });
  }

  function clearActiveMotion() {
    if (commandTimer !== null) clearInterval(commandTimer);
    commandTimer = null;
    activeDirection = "stop";
    activePointerId = null;
    activeKeyboardButton = null;
    if (activeButton !== null) activeButton.classList.remove("active");
    activeButton = null;
  }

  function beginDirectionMotion(button) {
    activeButton = button;
    activeButton.classList.add("active");
    activeDirection = activeButton.dataset.direction;
    ++motionGeneration;
    refreshCommand();
    commandTimer = setInterval(refreshCommand, 100);
  }

  function beginMotion(event) {
    if (activeButton !== null) return;
    activePointerId = event.pointerId;
    beginDirectionMotion(event.currentTarget);
    activeButton.setPointerCapture(event.pointerId);
  }

  function endPointerMotion(event) {
    if (event.pointerId !== activePointerId) return;
    stopMotion();
  }

  function beginKeyboardMotion(event) {
    if ((event.key !== " " && event.key !== "Enter") || event.repeat) return;
    event.preventDefault();
    if (activeButton !== null) return;
    activeKeyboardButton = event.currentTarget;
    beginDirectionMotion(event.currentTarget);
  }

  function endKeyboardMotion(event) {
    if (event.key !== " " && event.key !== "Enter") return;
    event.preventDefault();
    if (activePointerId !== null || activeButton !== event.currentTarget) return;
    stopMotion();
  }

  function stopKeyboardMotionOnBlur(event) {
    if (
      activeKeyboardButton !== event.currentTarget ||
      activeButton !== event.currentTarget ||
      activePointerId !== null
    ) return;
    stopMotion();
  }

  async function sendStop() {
    let lastError = null;
    for (let attempt = 0; attempt < 2; attempt += 1) {
      try {
        await post("/api/command", {
          direction: "stop",
          speed_rpm: Number(speed.value)
        }, true);
        return;
      } catch (error) {
        lastError = error;
      }
    }
    notice.textContent =
      `停车请求失败：${lastError.message}；后端看门狗将自动停车`;
  }

  function stopMotion() {
    const inFlightMotion = motionRequest;
    const previousStopBarrier = stopBarrier;
    ++motionGeneration;
    clearActiveMotion();
    const immediateStop = sendStop();
    const barrier =
      Promise.allSettled([immediateStop, inFlightMotion, previousStopBarrier])
        .then(async () => {
          if (inFlightMotion !== null) await sendStop();
        })
        .finally(() => {
          if (stopBarrier !== barrier) return;
          stopBarrier = null;
          if (activeDirection !== "stop") refreshCommand();
        });
    stopBarrier = barrier;
  }

  document.querySelectorAll("[data-direction]").forEach((button) => {
    button.addEventListener("pointerdown", beginMotion);
    button.addEventListener("pointerup", endPointerMotion);
    button.addEventListener("pointercancel", endPointerMotion);
    button.addEventListener("lostpointercapture", endPointerMotion);
    button.addEventListener("keydown", beginKeyboardMotion);
    button.addEventListener("keyup", endKeyboardMotion);
    button.addEventListener("blur", stopKeyboardMotionOnBlur);
  });

  function trackDriverRequest(enabled) {
    const request = post("/api/driver", {enabled});
    driverRequest = request;
    request.then(
      () => {
        if (driverRequest === request) driverRequest = null;
      },
      () => {
        if (driverRequest === request) driverRequest = null;
      }
    );
    return request;
  }

  function setDriverEnabled(enabled) {
    const generation = ++driverGeneration;
    const previousDriverBarrier = driverBarrier;
    if (!enabled) stopMotion();
    const currentStopBarrier = stopBarrier;
    const previousDriverRequest = driverRequest;
    const immediateDisable = enabled ? null : trackDriverRequest(false);
    const barrier = (async () => {
      await Promise.allSettled([
        previousDriverBarrier,
        currentStopBarrier,
        previousDriverRequest,
        immediateDisable,
      ]);
      if (generation !== driverGeneration) return;
      await trackDriverRequest(enabled);
    })();
    driverBarrier = barrier;
    barrier.then(
      () => {
        if (driverBarrier === barrier) driverBarrier = null;
        if (generation !== driverGeneration) return;
        notice.textContent = enabled
          ? "使能命令已发送（未验证）"
          : "失能命令已发送（未验证）";
        refreshStatus();
      },
      (error) => {
        if (driverBarrier === barrier) driverBarrier = null;
        if (generation !== driverGeneration) return;
        notice.textContent = error.message;
      }
    );
    return barrier;
  }

  document.getElementById("enable").addEventListener(
    "click", () => setDriverEnabled(true)
  );
  document.getElementById("disable").addEventListener(
    "click", () => setDriverEnabled(false)
  );

  async function refreshStatus() {
    try {
      const response = await fetch("/api/status", {cache: "no-store"});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const status = await response.json();
      const connection = document.getElementById("connection");
      connection.textContent = status.driver_connected ? "已发现" : "未发现";
      connection.className = `value ${status.driver_connected ? "ok" : "bad"}`;
      const hardwareFeedback = document.getElementById("hardwareFeedback");
      hardwareFeedback.textContent =
        status.hardware_feedback ? "已收到" : "未收到";
      hardwareFeedback.className =
        `value ${status.hardware_feedback ? "ok" : "bad"}`;
      const driver = document.getElementById("driver");
      driver.textContent = status.enabled ? "已发送使能" : "已发送失能";
      driver.className = "value pending";
      document.getElementById("command").textContent = JSON.stringify(status.command);
      document.getElementById("feedback").textContent =
        status.feedback === null ? "暂无反馈" : JSON.stringify(status.feedback);
    } catch (error) {
      document.getElementById("connection").textContent = "网页后端断开";
      document.getElementById("connection").className = "value bad";
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopMotion();
  });
  window.addEventListener("pagehide", stopMotion);
  window.addEventListener("blur", stopMotion);
  setInterval(refreshStatus, 500);
  refreshStatus();
</script>
</body>
</html>
